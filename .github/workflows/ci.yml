name: Verify Study Table
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify:corpus
      - run: npm run verify:words
      - run: npm test
      - run: npm run typecheck
      - run: npm audit --omit=dev
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
