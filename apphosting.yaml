runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 20
  cpu: 1
  memoryMiB: 1024
env:
  - variable: GEMINI_API_KEY
    secret: study-table-gemini-key
    availability: [RUNTIME]
  - variable: ACCESS_PASSWORD_HASH
    secret: study-table-password-hash
    availability: [RUNTIME]
  - variable: SESSION_SECRET
    secret: study-table-session-secret
    availability: [RUNTIME]
  - variable: RATE_LIMIT_SECRET
    secret: study-table-rate-limit-secret
    availability: [RUNTIME]
  - variable: APP_ORIGIN
    secret: study-table-app-origin
    availability: [RUNTIME]
  - variable: GEMINI_MODEL
    value: gemini-3.8-flash
    availability: [RUNTIME]
  - variable: TRUST_GOOGLE_PROXY
    value: "true"
    availability: [RUNTIME]
  - variable: AI_DAILY_LIMIT
    value: "10"
    availability: [RUNTIME]
  - variable: AI_GLOBAL_DAILY_LIMIT
    value: "50"
    availability: [RUNTIME]
