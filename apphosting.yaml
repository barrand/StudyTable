runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 20
  cpu: 1
  memoryMiB: 512
env:
  - variable: APP_ORIGIN
    value: https://study-table-preview--study-table-a2869.us-central1.hosted.app
    availability: [RUNTIME]
  - variable: GOOGLE_CLOUD_PROJECT
    value: study-table-a2869
    availability: [ RUNTIME ]
  - variable: GEMINI_MODEL
    value: gemini-3.8-flash
    availability: [ RUNTIME ]
  - variable: GEMINI_API_KEY
    secret: STUDY_GEMINI_API_KEY
    availability: [ RUNTIME ]
  - variable: ACCESS_PASSWORD_HASH
    secret: STUDY_ACCESS_PASSWORD_HASH
    availability: [ RUNTIME ]
  - variable: SESSION_SECRET
    secret: STUDY_SESSION_SECRET
    availability: [ RUNTIME ]
  - variable: RATE_LIMIT_SECRET
    secret: STUDY_RATE_LIMIT_SECRET
    availability: [ RUNTIME ]
  - variable: AI_PER_KEY_DAILY_LIMIT
    value: "10"
    availability: [ RUNTIME ]
  - variable: AI_GLOBAL_DAILY_LIMIT
    value: "50"
    availability: [ RUNTIME ]
  - variable: AI_CACHE_VERSION
    value: "1"
    availability: [ RUNTIME ]
  - variable: TRUSTED_PROXY_HOPS
    value: "1"
    availability: [ RUNTIME ]
